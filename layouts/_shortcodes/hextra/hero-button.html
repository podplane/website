{{- $link := .Get "link" -}}
{{- $text := .Get "text" -}}
{{- $style := .Get "style" -}}
{{- $secondary := eq (.Get "variant") "secondary" -}}

{{- $external := hasPrefix $link "http" -}}
{{- $href := cond (hasPrefix $link "/") ($link | relURL) $link -}}

<a
  href="{{ $href }}"
  class="not-prose hx:font-medium hx:cursor-pointer hx:px-6 hx:py-3 hx:rounded-full hx:text-center hx:inline-block hx:focus:outline-hidden hx:focus:ring-4 hx:transition-all hx:ease-in hx:duration-200 {{ if $secondary }}hx:border hx:border-gray-300 hx:text-gray-700 hx:hover:bg-gray-100 hx:focus:ring-gray-200 hx:dark:border-neutral-700 hx:dark:text-gray-200 hx:dark:hover:bg-neutral-800 hx:dark:focus:ring-neutral-700{{ else }}hx:text-white hx:bg-primary-600 hx:hover:bg-primary-700 hx:focus:ring-primary-300 hx:dark:bg-primary-600 hx:dark:hover:bg-primary-700 hx:dark:focus:ring-primary-800{{ end }}"
  {{ with $style }}style="{{ . | safeCSS }}"{{ end }}
  {{ if $external }}target="_blank" rel="noreferrer"{{ end -}}
>
  {{- $text -}}
</a>
